name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      # The CLI comes from the pinned devDependency, not a "latest" lookup that gets rate-limited.
      - name: Start local Supabase
        run: npx supabase start
      - name: Database tests (row-level security)
        run: npx supabase test db
      - name: Export local Supabase keys for e2e
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(npx supabase status -o env | grep '^API_URL=' | cut -d'"' -f2)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(npx supabase status -o env | grep -E '^(PUBLISHABLE_KEY|ANON_KEY)=' | head -n1 | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: "true"
          E2E: "1"
          E2E_PASSWORD: ci-only-e2e-password-1
          AI_FAKE: "1"
          RECIPE_SEARCH_FAKE: "1"
          # Any value: the fake search only needs the key to exist so Big sites can fall back to Spoonacular.
          SPOONACULAR_API_KEY: ci-fake-key
      - name: e2e (test login route is closed without E2E=1)
        run: npx playwright test -c playwright.locked.config.ts
        env:
          CI: "true"
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/**
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
